spring:
  application:
    name: housekeeping
  datasource:
    url: jdbc:postgresql://localhost:5433/housekeeping
    username: housekeeping
    password: housekeeping
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# No JWT signing key here on purpose: anyone reading this file could sign their own tokens. Set
# APP_SECURITY_JWT_SECRET (at least 32 bytes): the application refuses to start without it. The dev profile and the
# tests provide a local key.

# Swagger UI and the OpenAPI description are only served with the dev profile (see application-dev.yml)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
