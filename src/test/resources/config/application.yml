# Tests only. Spring Boot loads classpath:/config/application.yml in addition to classpath:/application.yml, whatever
# the active profiles: it completes the main configuration instead of replacing it, as a test application.yml would.
app:
  security:
    jwt:
      # Same key as the dev profile, so that TestJwtFactory tokens also work against a local dev server
      secret: dev-only-signing-key-for-the-technical-test-0123456789
  pms:
    client: logging
    # The tests run the outbox relay themselves, to control its timing
    relay:
      enabled: false
